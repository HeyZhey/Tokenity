[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenity"
version = "0.1.0"
description = "Mac-native MLX/MLX-LM cluster control plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Tokenity" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
]

[project.scripts]
tokenity = "tokenity.cli:main"

[tool.setuptools.packages.find]
include = ["tokenity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

