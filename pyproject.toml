[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenity"
version = "0.1.2"
description = "Mac-native MLX-LM and MLX-VLM inference control plane."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Tokenity" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
vlm = [
  "mlx-vlm==0.7.1",
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "transformers==5.16.1",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
]

[project.scripts]
tokenity = "tokenity.cli:main"

[tool.setuptools.packages.find]
include = ["tokenity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
